<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimulAI-RE</title>

    <link href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css" rel="stylesheet" />

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/geomap/geo_style.css">
</head>
<body>
    <header>
        <h1>SIMULAI-RE</h1>
        <nav>
            <a class="active" href="/">지도</a>
            <a href="/lua-ui/">Lua</a>
        </nav>
        <span id="status">로딩 중...</span>
    </header>

    <div class="layout">
        <aside>
            <div class="block">
                <h2>자산</h2>
                <ul id="company-list" class="list"></ul>
            </div>

            <div class="block">
                <h2>위치 추가</h2>
                <p class="empty">지도를 클릭하면 좌표가 입력됩니다. Lua의 locations 테이블로 전달됩니다.</p>
                <form id="location-form">
                    <label>이름 <input name="name" type="text" placeholder="포항"></label>
                    <div class="row">
                        <label>위도 <input name="latitude" type="number" min="-90" max="90" step="any" required></label>
                        <label>경도 <input name="longitude" type="number" min="-180" max="180" step="any" required></label>
                    </div>
                    <button type="submit">추가</button>
                </form>
                <ul id="location-list" class="list" style="margin-top: 12px"></ul>
            </div>

            <div class="block">
                <h2>광물 / 에너지 매장지</h2>
                <p class="empty">지도를 클릭하면 좌표가 입력됩니다. 매장지를 누르면 수정할 수 있습니다. Lua의 deposits 테이블로 전달됩니다.</p>
                <form id="deposit-form">
                    <label>이름 <input name="name" type="text" placeholder="필바라 철광산"></label>
                    <div class="row">
                        <label>분류
                            <select name="category">
                                <option value="mineral">광물</option>
                                <option value="energy">에너지</option>
                            </select>
                        </label>
                        <label>자원 <input name="resource" type="text" list="resource-names" placeholder="iron" required></label>
                    </div>
                    <div class="row">
                        <label>위도 <input name="latitude" type="number" min="-90" max="90" step="any" required></label>
                        <label>경도 <input name="longitude" type="number" min="-180" max="180" step="any" required></label>
                    </div>
                    <div class="row">
                        <label>매장량 <input name="reserve" type="number" min="0" step="any" value="100000" required></label>
                        <label>채굴능력 <input name="extraction_capacity" type="number" min="0" step="any" value="1000"></label>
                    </div>
                    <div class="row">
                        <label>채굴비용 <input name="extraction_cost" type="number" min="0" step="any" value="10"></label>
                        <label>가공수율 <input name="processing_yield" type="number" min="0" step="any" value="1"></label>
                    </div>
                    <div class="row">
                        <button type="submit" id="deposit-submit">추가</button>
                        <button type="button" id="deposit-cancel" hidden>취소</button>
                    </div>
                </form>
                <datalist id="resource-names"></datalist>

                <div class="row" style="margin-top: 12px">
                    <label>표시
                        <select id="deposit-filter-category">
                            <option value="">전체</option>
                            <option value="mineral">광물</option>
                            <option value="energy">에너지</option>
                        </select>
                    </label>
                    <label>자원 <select id="deposit-filter-resource"><option value="">전체</option></select></label>
                </div>
                <div id="deposit-totals" class="metrics" hidden></div>
                <ul id="deposit-list" class="list" style="margin-top: 12px"></ul>
            </div>
        </aside>

        <div id="map" class="map" tabindex="0"></div>

        <section class="panel">
            <div class="block">
                <h2 id="detail-title">자산 정보</h2>
                <p id="detail-sub" class="empty">자산을 선택하세요.</p>
                <div id="metrics" class="metrics" hidden></div>
            </div>
            <div class="block">
                <h2>추이</h2>
                <div class="chart"><canvas id="chart"></canvas></div>
            </div>
            <div class="block">
                <h2>턴별 데이터</h2>
                <div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="common.js"></script>
    <script type="module" src="../geomap/geo_main.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
