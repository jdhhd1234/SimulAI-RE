<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimulAI-RE</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.11.0/ol.css">

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/geomap/geo_style.css">
</head>
<body>
    <header>
        <h1>SIMULAI-RE</h1>
        <nav>
            <a class="active" href="/">지도</a>
            <a href="/lua-ui/">Lua</a>
        </nav>
        <span id="status">로딩 중...</span>
    </header>

    <div class="layout">
        <aside>
            <div class="block">
                <h2>자산</h2>
                <ul id="company-list" class="list"></ul>
            </div>

            <div class="block">
                <h2>위치 추가</h2>
                <p class="empty">지도를 클릭하면 좌표가 입력됩니다. Lua의 locations 테이블로 전달됩니다.</p>
                <form id="location-form">
                    <label>이름 <input name="name" type="text" placeholder="포항"></label>
                    <div class="row">
                        <label>위도 <input name="latitude" type="number" min="-90" max="90" step="any" required></label>
                        <label>경도 <input name="longitude" type="number" min="-180" max="180" step="any" required></label>
                    </div>
                    <button type="submit">추가</button>
                </form>
                <ul id="location-list" class="list" style="margin-top: 12px"></ul>
            </div>
        </aside>

        <div id="map" class="map" tabindex="0"></div>

        <section class="panel">
            <div class="block">
                <h2 id="detail-title">자산 정보</h2>
                <p id="detail-sub" class="empty">자산을 선택하세요.</p>
                <div id="metrics" class="metrics" hidden></div>
            </div>
            <div class="block">
                <h2>추이</h2>
                <div class="chart"><canvas id="chart"></canvas></div>
            </div>
            <div class="block">
                <h2>턴별 데이터</h2>
                <div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@v10.11.0/dist/ol.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../main/common.js"></script>
    <script src="../geomap/geo_main.js"></script>
    <script src="../main/main.js"></script>
</body>
</html>
