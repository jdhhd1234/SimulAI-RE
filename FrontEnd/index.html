<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초간단 시뮬레이션 엔진</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>초간단 시뮬레이션</h1>
        <p class="description">값을 입력하고 Python 시뮬레이션을 실행하세요.</p>

        <form id="simulation-form">
            <label for="input-value-cash-init">초기 현금 입력</label>
            <input id="input-value-cash-init" name="cash_init" type="number" min="0" step="0.1" value="10000" required>

            <label for="input-value-debt-init">초기 부채 입력</label>
            <input id="input-value-debt-init" name="debt_init" type="number" min="0" step="0.1" value="2000" required>

            <label for="input-value-sell-price">제품 판매 가격 입력</label>
            <input id="input-value-sell-price" name="sell_price" type="number" min="0.01" step="0.01" value="500" required>

            <label for="input-value-deltatime">delta Time 입력</label>
            <input id="input-value-deltatime" name="deltatime" type="number" min="0.01" step="0.01" value="0.1" required>

            <label for="input-value-stoptime">stoptime 입력</label>
            <input id="input-value-stoptime" name="stoptime" type="number" min="0.01" step="0.01" value="5" required>

            <button type="submit">시뮬레이션 실행</button>
        </form>

        <section class="result-box" aria-live="polite">
            <h2>결과</h2>
            <p id="status">아직 실행하지 않았습니다.</p>

            <div class="chart-grid">
                <article class="chart-card">
                    <h3>재무 결과</h3>
                    <div class="chart-container">
                        <canvas id="finance-chart"></canvas>
                    </div>
                </article>

                <article class="chart-card">
                    <h3>생산 결과</h3>
                    <div class="chart-container">
                        <canvas id="operations-chart"></canvas>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="main.js"></script>
</body>
</html>
