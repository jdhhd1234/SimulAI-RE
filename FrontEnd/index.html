<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시뮬레이션 스튜디오</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">모델 시뮬레이션</p>
                <h1>모델을 고르고, 값을 넣고, 결과를 확인하세요.</h1>
                <p class="description">
                    받아온 모델 목록과 입력 항목을 바탕으로, 화면이 자동으로 구성됩니다.
                </p>
                <p class="description">
                    참고로 달러기반 입니다.
                </p>
            </div>
            <div class="hero-badge" aria-hidden="true">
                <span>즉시 확인</span>
                <strong>결과 화면</strong>
            </div>
        </header>

        <main class="dashboard">
            <section class="panel panel--controls" aria-labelledby="controls-title">
                <div class="panel-heading">
                    <div>
                        <p class="section-kicker">모델 선택</p>
                        <h2 id="controls-title">시뮬레이션 설정</h2>
                    </div>
                    <button id="refresh-models" class="ghost-button" type="button">모델 새로고침</button>
                </div>

                <div class="field-group">
                    <label for="model-select">모델</label>
                    <select id="model-select" disabled>
                        <option>모델을 불러오는 중...</option>
                    </select>
                </div>

                <div id="model-meta" class="model-meta muted" aria-live="polite"></div>

                <form id="simulation-form" novalidate>
                    <div id="schema-fields" class="schema-fields">
                        <div class="empty-state">모델을 선택하면 입력 항목이 표시됩니다.</div>
                    </div>

                    <div class="form-actions">
                        <button id="run-button" class="primary-button" type="submit" disabled>시뮬레이션 실행</button>
                    </div>
                </form>
            </section>

            <section class="panel panel--results" aria-labelledby="results-title" aria-live="polite">
                <div class="panel-heading">
                    <div>
                        <p class="section-kicker">결과</p>
                        <h2 id="results-title">차트 출력</h2>
                    </div>
                    <span id="status-pill" class="status-pill status-pill--idle">대기 중</span>
                </div>

                <p id="status" class="status-text">모델을 선택하고 값을 조정한 뒤 실행하세요.</p>

                <div id="result-meta" class="result-meta"></div>

                <div id="chart-grid" class="chart-grid">
                    <div class="empty-state empty-state--large">아직 실행된 시뮬레이션이 없습니다.</div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="main.js"></script>
</body>
</html>
