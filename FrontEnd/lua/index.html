<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimulAI-RE · Lua</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>SIMULAI-RE</h1>
        <nav>
            <a href="/">지도</a>
            <a class="active" href="/lua-ui/">Lua</a>
        </nav>
        <span id="status">로딩 중...</span>
    </header>

    <div class="layout lua-layout">
        <aside>
            <div class="block">
                <h2>실행</h2>
                <label>파일 <select id="lua-file"></select></label>
                <div class="row3">
                    <label>start <input id="start" type="number" value="0" step="any"></label>
                    <label>stop <input id="stop" type="number" value="10" max="200" step="any"></label>
                    <label>dt <input id="dt" type="number" value="1" min="0.0001" step="any"></label>
                </div>
                <label class="check"><input id="to-map" type="checkbox"> 지도 자산으로 등록</label>
                <button id="run" type="button">실행</button>
            </div>
            <div class="block">
                <h2>콘솔</h2>
                <pre id="console">실행 전</pre>
            </div>
        </aside>

        <section class="lua-main">
            <div class="block">
                <h2>결과</h2>
                <div class="chart"><canvas id="chart"></canvas></div>
            </div>
            <div class="block">
                <h2>섹터</h2>
                <div class="table-wrap">
                    <table id="sector-table">
                        <thead><tr><th>섹터</th><th>생산 규칙</th><th>공장 수</th><th>capacity</th><th>위치</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="block">
                <h2>소스</h2>
                <pre id="source"></pre>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/common.js"></script>
    <script src="lua.js"></script>
</body>
</html>
